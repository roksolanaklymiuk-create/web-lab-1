<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Галерея</title>
</head>
<body>
    <h1>Галерея Клим`юк Роксолани</h1>
    <a href="index.html">Назад на головну</a>

    <h2>Мої зображення</h2>

    <h3>Зображення у цій папці</h3>
    <!-- Зображення має лежати в одній папці з файлом gallery.html -->
    <img src="640x480.png" alt="Зображення в поточній папці" width="640" height="480">

    <h3>Зображення у папці</h3>
    <!-- Зображення має лежати у вкладеній папці images -->
    <img src="images/640x480.png" alt="Зображення в папці images" width="640" height="480">
    
    <h3>Зображення онлайн</h3>
    <!-- Зображення завантажується напряму з інтернету -->
    <img src="https://placehold.co/1280x1024" alt="Зображення онлайн" width="1280" height="1024">
</body>
</html>
